<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財經監控儀表板</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141925; --panel2:#1b2230; --line:#26304a;
    --txt:#e6ebf5; --muted:#8a96ad; --up:#26d07c; --down:#ff5c6c; --flat:#c9b458;
    --hi:#ff5c6c; --med:#f0a93b; --lo:#5a89ff; --accent:#4f7cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#16203a 0%,var(--bg) 55%);
    color:var(--txt);min-height:100vh;padding:22px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
  h1{font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:11px;height:11px;border-radius:50%;background:var(--up);box-shadow:0 0 12px var(--up);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .back{color:var(--muted);font-size:12.5px;text-decoration:none;margin-bottom:10px;display:inline-block}
  .back:hover{color:var(--accent)}
  .mood{padding:8px 14px;border-radius:30px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
  .mood.riskon{color:var(--up);border-color:rgba(38,208,124,.4)}
  .mood.riskoff{color:var(--down);border-color:rgba(255,92,108,.4)}
  .mood.neutral{color:var(--flat);border-color:rgba(201,180,88,.4)}

  .tabs{display:flex;gap:8px;margin:6px 0 18px}
  .tab{padding:9px 18px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 0 12px;font-weight:700}

  .mkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .mkt-sub{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
  .mkt-sub::before{content:"";width:3px;height:13px;background:var(--accent);border-radius:2px}
  .mkt-sub:first-child{margin-top:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .mkt .nm{font-size:13px;color:var(--muted);margin-bottom:6px}
  .mkt .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .mkt .chg{font-size:14px;font-weight:700;margin-top:2px}
  .mkt .note{font-size:11px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  .spark{width:100%;height:30px;margin-top:9px;display:block;overflow:visible}
  .spark polyline{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .spark.up polyline{stroke:var(--up)} .spark.down polyline{stroke:var(--down)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .arrow{display:inline-block;margin-right:3px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;color:var(--txt);font-size:14px}
  .search::placeholder{color:var(--muted)}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:8px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
  .chip.on{background:var(--panel2);color:var(--txt);border-color:var(--accent)}
  .chip.hi.on{border-color:var(--hi);color:var(--hi)}
  .chip.med.on{border-color:var(--med);color:var(--med)}
  .chip.lo.on{border-color:var(--lo);color:var(--lo)}

  .day{margin-bottom:14px}
  .day-head{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 16px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;user-select:none}
  .day-head:hover{border-color:var(--accent)}
  .day-head .d{font-size:16px;font-weight:700}
  .day-head .wd{font-size:12px;color:var(--muted)}
  .day-head .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .day-head .caret{transition:.2s;color:var(--muted)}
  .day.collapsed .caret{transform:rotate(-90deg)}
  .day.collapsed .day-body{display:none}
  .day-body{padding:12px 4px 4px}

  .news{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-left-width:4px;
    border-radius:11px;background:var(--panel);margin-bottom:10px;transition:.15s}
  .news:hover{background:var(--panel2)}
  .news.hi{border-left-color:var(--hi)}
  .news.med{border-left-color:var(--med)}
  .news.lo{border-left-color:var(--lo)}
  .news .body{flex:1}
  .news .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .news .ttl{font-size:15.5px;font-weight:700}
  .news .sum{font-size:13.5px;color:#c4cde0}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.5px}
  .badge.hi{background:rgba(255,92,108,.16);color:var(--hi)}
  .badge.med{background:rgba(240,169,59,.16);color:var(--med)}
  .badge.lo{background:rgba(90,137,255,.16);color:var(--lo)}
  .cat{font-size:11px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:6px}
  .meta{font-size:11.5px;color:var(--muted);margin-top:8px}
  .meta a{color:var(--accent);text-decoration:none}
  .meta a:hover{text-decoration:underline}
  .del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;
    width:30px;height:30px;cursor:pointer;font-size:15px;flex-shrink:0;transition:.15s}
  .del:hover{border-color:var(--down);color:var(--down)}

  /* ===== 股票區 ===== */
  .stk-wrap{margin-bottom:8px}
  .sector-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .sector{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;
    background:var(--panel);border:1px solid var(--line);font-size:13px}
  .sector .snm{font-weight:700}
  .sector .schg{font-weight:700;font-variant-numeric:tabular-nums}
  .sector .arrow{margin-right:2px}
  .sector .snote{color:var(--muted);font-size:11px}
  .mover-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .mover{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .mover .msym{font-size:14px;font-weight:800;letter-spacing:.5px}
  .mover .mnm{font-size:11px;color:var(--muted);margin-bottom:6px}
  .mover .mpr{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .mover .mchg{font-size:13px;font-weight:700;margin-top:1px}
  .mover .mnote{font-size:10.5px;color:var(--muted);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}

  /* ===== 事件內受惠/受害股 ===== */
  .rel{border-top:1px dashed var(--line);margin-top:10px;padding-top:9px;display:flex;gap:8px;flex-wrap:wrap}
  .rel-tag{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line)}
  .rel-tag .ri{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
  .rel-tag .ri.win{background:rgba(38,208,124,.16);color:var(--up)}
  .rel-tag .ri.lose{background:rgba(255,92,108,.16);color:var(--down)}
  .rel-tag .ri.neu{background:rgba(201,180,88,.16);color:var(--flat)}
  .rel-tag .rs{font-weight:700}
  .rel-tag .rc{font-variant-numeric:tabular-nums;font-weight:700}

  /* ===== 重大事件卡 ===== */
  .evt{border:1px solid var(--line);border-left-width:4px;border-radius:13px;background:var(--panel);
    padding:16px 18px;margin-bottom:14px;transition:.15s}
  .evt:hover{background:var(--panel2)}
  .evt.hi{border-left-color:var(--hi)}
  .evt.med{border-left-color:var(--med)}
  .evt.lo{border-left-color:var(--lo)}
  .evt .ehead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .evt .etitle{font-size:18px;font-weight:800}
  .evt .esum{font-size:14px;color:#c4cde0;margin-bottom:10px}
  .status{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.5px}
  .status.ongoing{background:rgba(38,208,124,.16);color:var(--up)}
  .status.watch{background:rgba(240,169,59,.16);color:var(--med)}
  .status.closed{background:rgba(138,150,173,.16);color:var(--muted)}
  .evt .edates{font-size:11.5px;color:var(--muted);margin-left:auto}
  .etl{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
  .etl-item{display:flex;gap:10px;font-size:13px;color:#c4cde0;margin-bottom:7px}
  .etl-item .td{color:var(--accent);font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:78px}
  .esrc{font-size:11.5px;color:var(--muted);margin-top:6px}
  .esrc a{color:var(--accent);text-decoration:none;margin-right:10px}
  .esrc a:hover{text-decoration:underline}

  /* ===== 主頁兩欄 + 右側 rail ===== */
  #view-events{position:relative}
  .ev-rail{margin-top:22px}
  .ev-rail .section-title{margin-top:0}
  .ev-rail .section-title + *{margin-top:0}
  .ev-rail .section-title:not(:first-child){margin-top:22px}
  @media(min-width:1840px){
    .ev-rail{position:absolute;left:100%;top:0;margin-top:0;margin-left:24px;width:280px}
  }

  /* 本週關注 */
  .watch{border:1px solid var(--line);border-left:4px solid var(--med);border-radius:11px;
    background:var(--panel);padding:12px 14px;margin-bottom:10px}
  .watch .wt{font-size:14.5px;font-weight:700;margin-bottom:4px}
  .watch .wc{font-size:11px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:6px}
  .watch .wn{font-size:12px;color:#c4cde0;margin-top:7px}

  /* 情緒燈號歷史 */
  .mood-strip{display:flex;flex-wrap:wrap;gap:4px}
  .mc{width:16px;height:16px;border-radius:4px;cursor:default;border:1px solid rgba(255,255,255,.06)}
  .mc.up{background:var(--up)} .mc.down{background:var(--down)} .mc.flat{background:var(--flat)}
  .mood-legend{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted)}
  .mood-legend span{display:flex;align-items:center;gap:5px}
  .mood-legend .ml{width:11px;height:11px;border-radius:3px;display:inline-block}
  .mood-legend .ml.up{background:var(--up)} .mood-legend .ml.down{background:var(--down)} .mood-legend .ml.flat{background:var(--flat)}

  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:4px}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
  .footer{margin-top:26px;color:var(--muted);font-size:11.5px;text-align:center;border-top:1px solid var(--line);padding-top:14px}
  .restore{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 回入口主頁</a>
  <header>
    <div>
      <h1><span class="dot"></span>財經監控儀表板</h1>
      <div class="sub" id="sub">資料更新於 —</div>
    </div>
    <div class="mood" id="mood">—</div>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="events" onclick="setView('events')">重大事件</div>
    <div class="tab" data-view="daily" onclick="setView('daily')">每日新聞</div>
  </div>

  <!-- 重大事件 -->
  <div id="view-events">
    <div class="ev-main">
      <div class="stk-wrap">
        <div class="section-title">類股表現</div>
        <div class="sector-row" id="sectorRow"></div>
        <div class="section-title">重點個股漲跌榜</div>
        <div class="mover-grid" id="moverGrid"></div>
      </div>
      <div class="section-title">追蹤中的重大事件</div>
      <div id="eventsList"></div>
    </div>
    <aside class="ev-rail">
      <div class="section-title">本週關注</div>
      <div id="watchList"></div>
      <div class="section-title">情緒燈號</div>
      <div class="mood-strip" id="moodStrip"></div>
      <div class="mood-legend">
        <span><i class="ml up"></i>Risk-On</span>
        <span><i class="ml flat"></i>中性</span>
        <span><i class="ml down"></i>Risk-Off</span>
      </div>
    </aside>
  </div>

  <!-- 每日新聞 -->
  <div id="view-daily" style="display:none">
    <div class="section-title">今日市場狀況</div>
    <div id="mktSection"></div>
    <div class="section-title">每日新聞時間軸</div>
    <div class="controls">
      <input class="search" id="search" placeholder="🔍 搜尋關鍵字、來源、分類…" oninput="renderDaily()">
      <div class="chips" id="impChips">
        <div class="chip hi on" data-imp="high" onclick="toggleImp(this)">高</div>
        <div class="chip med on" data-imp="medium" onclick="toggleImp(this)">中</div>
        <div class="chip lo on" data-imp="low" onclick="toggleImp(this)">低</div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="timeline"></div>
  </div>

  <div class="footer">
    財經監控儀表板 · 每日 21:00 自動更新 · 刪除紀錄僅存於本機瀏覽器
    <span id="restoreWrap"></span>
  </div>
</div>

<!-- 資料檔(由每日排程維護,版面不需更動) -->
<script src="finance-data.js"></script>
<script>
const DATA = window.FINANCE_DATA || { lastUpdated:"—", majorEvents:[], days:[] };

/* ====== 本機刪除紀錄 ====== */
const DEL_KEY = "finance_dash_deleted";
function getDeleted(){ try{return JSON.parse(localStorage.getItem(DEL_KEY))||[]}catch(e){return[]} }
function setDeleted(a){ localStorage.setItem(DEL_KEY, JSON.stringify(a)) }
function delItem(id){ const d=getDeleted(); if(!d.includes(id)){d.push(id);setDeleted(d)} renderDaily() }
function restoreAll(){ setDeleted([]); renderDaily() }
const isDel = id => getDeleted().includes(id);

const ARROW={up:"▲",down:"▼",flat:"▬"};
const IMPLABEL={high:"高",medium:"中",low:"低"};
const IMPCLS={high:"hi",medium:"med",low:"lo"};
const STATUSLABEL={ongoing:"進行中",watch:"待觀察",closed:"已落幕"};

/* 把字串值轉成數字(去掉 $ , % 等),無法解析回 null */
function numVal(v){ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:null; }
/* 蒐集某市場項目跨日的數值序列(舊→新) */
function collectSeries(groupKey, name){
  const days=DATA.days||[]; const s=[];
  for(let i=days.length-1;i>=0;i--){
    const arr=(days[i].market&&days[i].market[groupKey])||[];
    const it=arr.find(x=>x.name===name);
    if(it){ const n=numVal(it.value); if(n!==null) s.push(n); }
  }
  return s;
}
/* 迷你走勢線:資料 >=2 點才畫,顏色依期間淨漲跌 */
function sparkline(series){
  if(!series||series.length<2) return '';
  const w=200,h=30,pad=3;
  const min=Math.min(...series),max=Math.max(...series),rng=(max-min)||1;
  const stepX=(w-pad*2)/(series.length-1);
  const pts=series.map((v,i)=>`${(pad+i*stepX).toFixed(1)},${(pad+(h-pad*2)*(1-(v-min)/rng)).toFixed(1)}`).join(' ');
  const cls=series[series.length-1]>=series[0]?'up':'down';
  return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" title="近 ${series.length} 日走勢"><polyline points="${pts}"/></svg>`;
}
function mktCard(m, series){
  return `<div class="card mkt"><div class="nm">${m.name}</div>
    <div class="val">${m.value}</div>
    <div class="chg ${m.dir}"><span class="arrow">${ARROW[m.dir]}</span>${m.change}</div>
    ${sparkline(series)}
    <div class="note">${m.note||""}</div></div>`;
}
function newsCard(n){
  return `<div class="news ${IMPCLS[n.importance]||'lo'}">
    <div class="body">
      <div class="top">
        <span class="badge ${IMPCLS[n.importance]||'lo'}">${IMPLABEL[n.importance]||''}</span>
        <span class="cat">${n.category}</span>
        <span class="ttl">${n.title}</span>
      </div>
      <div class="sum">${n.summary}</div>
      <div class="meta">來源:${n.url?`<a href="${n.url}" target="_blank">${n.source} ↗</a>`:n.source}</div>
    </div>
    <button class="del" title="刪除" onclick="delItem('${n.id}')">✕</button>
  </div>`;
}

/* ====== 股票區 ====== */
const IMPACTCLS={"受惠":"win","受害":"lose","中性":"neu"};
function sectorChip(s){
  return `<div class="sector">
    <span class="snm">${s.name}</span>
    <span class="schg ${s.dir}"><span class="arrow">${ARROW[s.dir]||''}</span>${s.change}</span>
    ${s.note?`<span class="snote">${s.note}</span>`:''}
  </div>`;
}
function moverCard(m){
  return `<div class="mover">
    <div class="msym">${m.symbol||m.name}</div>
    <div class="mnm">${m.name||''}</div>
    <div class="mpr">${m.price||''}</div>
    <div class="mchg ${m.dir}"><span class="arrow">${ARROW[m.dir]||''}</span>${m.change||''}</div>
    ${m.note?`<div class="mnote">${m.note}</div>`:''}
  </div>`;
}
function relTag(r){
  const ic=IMPACTCLS[r.impact]||'neu';
  return `<span class="rel-tag">
    <span class="ri ${ic}">${r.impact||''}</span>
    <span class="rs">${r.symbol?r.symbol+' ':''}${r.name||''}</span>
    ${r.change?`<span class="rc ${ic==='win'?'up':ic==='lose'?'down':'flat'}">${r.change}</span>`:''}
    ${r.note?`<span class="snote">${r.note}</span>`:''}
  </span>`;
}

/* ====== 重大事件 ====== */
function eventCard(e){
  const cls = IMPCLS[e.importance]||'lo';
  const st  = e.status||'ongoing';
  const tl  = (e.timeline||[]).map(t=>
    `<div class="etl-item"><span class="td">${t.date}</span><span>${t.note}</span></div>`).join('');
  const rel = (e.relatedStocks||[]).map(relTag).join('');
  const src = (e.sources||[]).map(s=>
    s.url?`<a href="${s.url}" target="_blank">${s.source} ↗</a>`:`<span>${s.source}</span>`).join('');
  const dates = e.started ? `${e.started}${e.updated&&e.updated!==e.started?` → ${e.updated}`:''}` : '';
  return `<div class="evt ${cls}">
    <div class="ehead">
      <span class="status ${st}">${STATUSLABEL[st]||st}</span>
      <span class="cat">${e.category||''}</span>
      <span class="etitle">${e.title}</span>
      <span class="edates">${dates}</span>
    </div>
    <div class="esum">${e.summary||''}</div>
    ${tl?`<div class="etl">${tl}</div>`:''}
    ${rel?`<div class="rel">${rel}</div>`:''}
    ${src?`<div class="esrc">${src}</div>`:''}
  </div>`;
}

function renderHeader(){
  document.getElementById('sub').textContent = "資料更新於 " + (DATA.lastUpdated||'—');
  const today = (DATA.days&&DATA.days[0]) || null;
  const mEl = document.getElementById('mood');
  if(!today){ mEl.textContent='—'; return; }
  const map={"risk-on":["riskon","🟢 風險偏好 Risk-On"],"risk-off":["riskoff","🔴 避險 Risk-Off"],"neutral":["neutral","🟡 中性觀望"]};
  const [cls,txt]=map[today.mood]||map.neutral;
  mEl.className="mood "+cls; mEl.textContent=txt;
  mEl.title=today.moodNote||"";
}

/* 本週關注:事件線中 status=watch 的 */
function watchCard(e){
  const note = (e.timeline&&e.timeline[0])?e.timeline[0].note:'';
  return `<div class="watch">
    <div class="wt">${e.title}</div>
    <span class="wc">${e.category||''}</span>
    ${note?`<div class="wn">${note}</div>`:''}
  </div>`;
}
/* 情緒燈號:近 N 天 mood 色塊(舊→新) */
const MOODCLS={"risk-on":"up","risk-off":"down","neutral":"flat"};
function renderMoodStrip(){
  const days=(DATA.days||[]).slice(0,28).reverse(); // 取近28天,左舊右新
  document.getElementById('moodStrip').innerHTML = days.length
    ? days.map(d=>`<div class="mc ${MOODCLS[d.mood]||'flat'}" title="${d.date} · ${d.moodNote||d.mood||''}"></div>`).join('')
    : '<div class="empty" style="padding:10px">—</div>';
}

function renderEvents(){
  const stk = DATA.stocks||{};
  const sectors = stk.sectors||[];
  const movers = stk.movers||[];
  document.getElementById('sectorRow').innerHTML =
    sectors.length ? sectors.map(sectorChip).join('') : '<div class="empty" style="padding:14px">—</div>';
  document.getElementById('moverGrid').innerHTML =
    movers.length ? movers.map(moverCard).join('') : '<div class="empty" style="padding:14px">—</div>';
  const list = DATA.majorEvents||[];
  document.getElementById('eventsList').innerHTML =
    list.length ? list.map(eventCard).join('') : '<div class="empty">目前沒有追蹤中的重大事件</div>';
  // 右側 rail
  const watch = list.filter(e=>e.status==='watch');
  document.getElementById('watchList').innerHTML =
    watch.length ? watch.map(watchCard).join('') : '<div class="empty" style="padding:14px;font-size:12px">本週無待觀察事件</div>';
  renderMoodStrip();
}

function mktGroup(label, arr, groupKey){
  if(!arr||!arr.length) return '';
  return `<div class="mkt-sub">${label}</div><div class="mkt-grid mkt">${arr.map(m=>mktCard(m, collectSeries(groupKey, m.name))).join('')}</div>`;
}
function renderDaily(){
  const days = DATA.days||[];
  // 市場卡片(以最新一天,分組顯示)
  const t = days[0];
  if(t){
    const m=t.market||{};
    document.getElementById('mktSection').innerHTML =
      mktGroup('指數', m.indices, 'indices') +
      mktGroup('專業指標', m.indicators, 'indicators') +
      mktGroup('原物料', m.commodities, 'commodities') +
      mktGroup('加密貨幣', m.crypto, 'crypto') +
      mktGroup('匯率', m.fx, 'fx');
  }
  // 時間軸 + 搜尋/篩選
  const q=(document.getElementById('search').value||'').toLowerCase();
  const imps=[...document.querySelectorAll('#impChips .chip.on')].map(c=>c.dataset.imp);
  let totalShown=0, hi=0;
  const html = days.map(day=>{
    const items = (day.news||[]).filter(n=>!isDel(n.id) && imps.includes(n.importance) &&
      (!q || (n.title+n.summary+n.category+n.source).toLowerCase().includes(q)));
    if(!items.length) return '';
    totalShown+=items.length; hi+=items.filter(n=>n.importance==='high').length;
    return `<div class="day">
      <div class="day-head" onclick="this.parentNode.classList.toggle('collapsed')">
        <span class="d">${day.date}</span><span class="wd">${day.weekday||''}</span>
        <span class="count">${items.length} 則</span><span class="caret">▾</span>
      </div>
      <div class="day-body">${items.map(newsCard).join('')}</div>
    </div>`;
  }).join('');
  document.getElementById('timeline').innerHTML = html || '<div class="empty">沒有符合條件的項目</div>';
  document.getElementById('stats').innerHTML =
    `<div class="stat"><div class="n">${days.length}</div><div class="l">追蹤天數</div></div>
     <div class="stat"><div class="n">${totalShown}</div><div class="l">顯示則數</div></div>
     <div class="stat"><div class="n">${hi}</div><div class="l">高重要度</div></div>`;
  const delCount=getDeleted().length;
  document.getElementById('restoreWrap').innerHTML = delCount?` · 已刪除 ${delCount} 則 <button class="restore" onclick="restoreAll()">全部還原</button>`:'';
}

function toggleImp(el){ el.classList.toggle('on'); renderDaily() }
function setView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('view-events').style.display = v==='events'?'block':'none';
  document.getElementById('view-daily').style.display  = v==='daily' ?'block':'none';
}

renderHeader(); renderEvents(); renderDaily();
</script>
</body>
</html>
